<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>😀 Emoji Translator</h1>
        <p>Type a sentence and turn words into emojis!</p>

        <textarea
            id="inputText"
            placeholder="Example: I love pizza and coffee ❤️"
        ></textarea>

        <button id="translateBtn">✨ Translate</button>
        <button id="clearBtn">Clear</button>

        <div class="output-box">
            <h3>Result</h3>
            <p id="outputText">Your translated text will appear here...</p>
        </div>

        <button id="copyBtn">📋 Copy Result</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
